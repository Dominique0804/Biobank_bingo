services:
  - type: web
    name: biobank-bingo
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/bingo.sqlite3
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: bingo-data
      mountPath: /var/data
      sizeGB: 1
